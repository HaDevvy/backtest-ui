# PostgreSQL + the review UI.
# Tables are NOT created here: your backtest process creates them
# (Base.metadata.create_all). The UI is read-only and shows a "waiting for
# tables" page until they exist.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backtest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backtest}
      POSTGRES_DB: ${POSTGRES_DB:-backtest}
    ports:
      # Exposed so the backtest process on the host can write to it:
      # postgresql://backtest:backtest@localhost:5432/backtest
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-backtest}:${POSTGRES_PASSWORD:-backtest}@postgres:5432/${POSTGRES_DB:-backtest}
    ports:
      - "127.0.0.1:${UI_PORT:-8000}:8000"

volumes:
  pgdata:
